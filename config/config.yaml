# ---------------------------------------------------------------------------
# autogram configuration. Non-secret only. Env vars override any value here
# (see autogram/config.py for the AUTOGRAM_* override scheme).
# Credentials live in the environment / .env, never here.
# ---------------------------------------------------------------------------

# The single source of truth for editorial direction.
# Change active_profile to switch the entire content mode.
content:
  active_profile: "ai_tools"

  profiles:

    # -------------------------------------------------------------------------
    # ROMANCE PROFILE
    # -------------------------------------------------------------------------
    romance:
      theme: "high-quality, photorealistic romantic images of couples deeply in love, with expressive faces, natural emotion, cinematic lighting, beautiful backgrounds, and professional photography aesthetics"

      system_prompt: >
        You are an art director generating a single creative brief for one
        photorealistic image of a romantic South Asian couple.

      subject_instruction: >
        Produce one fresh, specific, visually concrete brief featuring the
        couple in the described location.

      prompt_anchor: >
        the same recognizable romantic couple: a mid-20s South Asian woman
        with warm olive skin, soft almond dark-brown eyes, high cheekbones,
        full lips, long wavy jet-black side-swept hair and a small red bindi;
        and a late-20s South Asian man with wheatish-tan skin, deep-set
        dark-brown eyes, a defined square jawline, short groomed dark beard
        and thick black hair; both fully clothed in elegant modest attire

      visual:
        interaction_styles:
          - "walking hand-in-hand"
          - "gazing into each other's eyes"
          - "intimate embrace"
          - "laughing while walking"
          - "quiet contemplation side-by-side"

        moods_and_emotions:
          - "tender and romantic"
          - "playful and joyful"
          - "peaceful and serene"
          - "nostalgic and reflective"

        photography_trends:
          compositions:
            - "rule of thirds"
            - "leading lines"
            - "environmental storytelling"
            - "layered foreground, middle ground and background"

          lighting_styles:
            - "golden hour warm backlighting"
            - "soft overcast daylight"
            - "dramatic side lighting"
            - "cool blue hour"

          color_grading:
            - "warm earthy tones with muted saturation"
            - "vintage film aesthetic"
            - "moody dark romantic grading"

          depth_of_field:
            - "deep focus with the environment readable"
            - "moderate depth of field"
            - "selective focus"

        locations:
          nature:
            - name: "Alpine meadow with wildflowers"
              description: "Expansive alpine meadow with wildflowers, distant snow-capped peaks and mist"
              lighting: "Golden hour sunlight"
              mood: "serene, adventurous, intimate"

            - name: "Tropical beach at golden hour"
              description: "White sand beach, turquoise ocean, palm trees and an expansive golden sky"
              lighting: "Warm golden hour sunlight"
              mood: "romantic, carefree, tropical"

            - name: "Misty forest morning"
              description: "Long forest path fading into atmospheric mist beneath tall trees"
              lighting: "Soft diffused dawn light"
              mood: "dreamlike and intimate"

          city:
            - name: "Rain-soaked city street"
              description: "Wet urban street with neon reflections, storefronts and blurred city lights"
              lighting: "Cool neon mixed with warm city light"
              mood: "romantic, moody, cinematic"

            - name: "Indian palace courtyard"
              description: "Ornate palace courtyard with tile work, marble arches and fountains"
              lighting: "Golden hour light"
              mood: "regal, elegant, heritage"


    # -------------------------------------------------------------------------
    # AI EDUCATION / AI TOOLS PROFILE
    # -------------------------------------------------------------------------
    ai_tools:
      theme: >
        clear, practical and genuinely useful educational content about
        artificial intelligence, AI tools, LLMs, agents, RAG, prompting,
        automation, AI engineering, AI security, AI workflows and how
        modern AI systems actually work

      system_prompt: >
        You are the educational content director of a high-quality AI
        learning publication. Every post must teach the audience something
        concrete about artificial intelligence. Prioritize clarity,
        technical accuracy, practical usefulness and simple explanations
        over visual spectacle or generic AI imagery. The viewer should learn
        something they can remember and apply after seeing the post.

      subject_instruction: >
        Create one fresh and useful educational AI topic. The topic can be
        a definition, concept explanation, how-it-works breakdown, practical
        tutorial, comparison, workflow, tool explanation, architecture
        explanation, security concept or AI engineering concept. Strong
        examples include RAG, tokens, embeddings, vector databases,
        hallucinations, context windows, in-context learning, prompting,
        structured outputs, agents, tool calling, MCP, Claude plugins,
        coding agents, inference, transformers, attention, fine-tuning,
        LoRA, quantization, multimodal AI, model routing, evaluation,
        prompt injection, AI automation and practical AI workflows.

        The post must answer useful questions such as:
        What is it?
        How does it work?
        Why does it matter?
        When should I use it?
        What is a simple example?
        What is a common mistake?

        Do not create generic "AI is changing the world" content.
        Do not create generic people sitting at laptops.
        Do not create romantic, lifestyle, fashion or cinematic human scenes.

      prompt_anchor: >
        clean modern educational AI infographic, technical diagram,
        professional technology publication aesthetic, information-first
        layout, clear visual hierarchy, concise readable labels, useful
        explanatory text, no logos, no generic people, no lifestyle
        photography

      visual:
        moods_and_emotions:
          - "clear and educational"
          - "curious and practical"
          - "technical and approachable"
          - "focused and informative"
          - "simple and easy to understand"

        # Kept under the existing name for config compatibility.
        # These are now graphic-design compositions, not photography scenes.
        photography_trends:
          compositions:
            - "information-first infographic"
            - "process flow diagram"
            - "technical architecture diagram"
            - "step-by-step educational layout"
            - "comparison card"
            - "concept map"
            - "annotated technical interface"
            - "input-to-output system diagram"

          lighting_styles:
            - "clean presentation lighting"
            - "flat editorial lighting"
            - "bright technical presentation"

          color_grading:
            - "professional neutral technology palette"
            - "clean blue and violet educational palette"
            - "modern technology palette with one accent"
            - "minimal high-contrast editorial palette"

          depth_of_field:
            - "sharp readable graphic elements throughout"
            - "uniform graphic clarity"
            - "crisp technical detail"

        # Kept for compatibility with the existing location-rotation code.
        # These are educational canvases, NOT physical workplaces.
        locations:
          education:
            - name: "AI concept diagram"
              description: >
                Clean educational canvas showing one AI concept with
                connected components, arrows, labels and concise explanations
              lighting: "Clean presentation lighting"
              mood: "clear and educational"

            - name: "AI architecture board"
              description: >
                Technical architecture visualization showing how AI
                components exchange information using clear boxes, arrows
                and labels
              lighting: "Flat editorial lighting"
              mood: "technical and informative"

            - name: "AI process explainer"
              description: >
                Vertical educational graphic showing an input moving through
                stages of an AI system toward an output
              lighting: "Bright technical presentation"
              mood: "simple and easy to understand"

            - name: "AI comparison board"
              description: >
                Clean two-sided educational comparison showing the difference
                between two AI concepts, tools or approaches
              lighting: "Clean presentation lighting"
              mood: "clear and practical"

        # New explicit AI visual direction consumed by brief.py.
        ai_tools_visual_direction:
          formats:
            - "educational infographic"
            - "process flow diagram"
            - "technical architecture diagram"
            - "step-by-step explainer"
            - "comparison card"
            - "concept map"
            - "annotated technical interface"
            - "input-to-output workflow diagram"

          contexts:
            - "AI concept explanation"
            - "LLM architecture explanation"
            - "AI workflow explanation"
            - "technical process visualization"
            - "AI tool explanation"
            - "developer-focused AI tutorial"
            - "AI system architecture"
            - "AI security explanation"

          actions:
            - "show the flow of information through the AI system"
            - "show the components and how they connect"
            - "show the transformation from input to output"
            - "show the steps required to perform the workflow"
            - "show the difference between two approaches"
            - "show the key concept using labels and arrows"

          ui_styles:
            - "clean technical infographic"
            - "minimal SaaS-style interface"
            - "developer documentation aesthetic"
            - "modern technical dashboard"
            - "clean architecture diagram"
            - "editorial AI learning card"


    # -------------------------------------------------------------------------
    # PSYCHOLOGY PROFILE
    # -------------------------------------------------------------------------
    psychology:
      theme: >
        thoughtful, evidence-aware visual content about psychology, habits,
        emotions, behavior and self-understanding

      system_prompt: >
        You are an editorial art director for a compassionate psychology
        publication.

      subject_instruction: >
        Create a grounded, respectful visual story about an everyday
        psychological concept, habit, emotion or reflection; never imply
        diagnosis or medical advice.

      prompt_anchor: >
        warm human-centered editorial photograph, diverse adult subjects,
        respectful natural expressions

      visual:
        moods_and_emotions:
          - "reflective and calm"
          - "hopeful"
          - "grounded and compassionate"

        photography_trends:
          compositions:
            - "quiet observational scene"
            - "symbolic everyday still life"
            - "environmental portrait with negative space"

          lighting_styles:
            - "soft morning light"
            - "gentle overcast daylight"
            - "warm reading-lamp light"

          color_grading:
            - "muted calming earth tones"
            - "soft natural documentary color"

          depth_of_field:
            - "moderate depth of field"
            - "deep focus with environmental context"

        locations:
          everyday:
            - name: "Quiet reading nook"
              description: "A comfortable reading nook with journal, tea and soft natural light"
              lighting: "Soft morning light"
              mood: "reflective and calm"

            - name: "Peaceful park walk"
              description: "A leafy city park path with a person taking a thoughtful walk"
              lighting: "Gentle overcast daylight"
              mood: "grounded and hopeful"


# ---------------------------------------------------------------------------
# DETERMINISTIC VARIATION
# ---------------------------------------------------------------------------

seed_salt: "autogram-ai-education-v2"


# ---------------------------------------------------------------------------
# BRIEF GENERATION
# ---------------------------------------------------------------------------

brief:
  history_depth: 30

  # rapidfuzz token_set_ratio above this value is considered a duplicate.
  dedupe_threshold: 85

  max_retries: 3

  # These are compatibility axes. In AI-tools mode they are interpreted as
  # graphic/layout hints, never as photography instructions.
  axes:
    camera_angle:
      - "flat front-facing"
      - "slight perspective"
      - "overhead diagram view"
      - "isometric view"

    season:
      - "spring"
      - "summer"
      - "autumn"
      - "winter"

    focal_length:
      - "not applicable"
      - "editorial wide"
      - "standard editorial"
      - "macro detail"

    subject_scale:
      - "concept-focused"
      - "component-focused"
      - "full process"
      - "overview"


# ---------------------------------------------------------------------------
# LOCAL LLM
# ---------------------------------------------------------------------------

llm:
  host_env: "OLLAMA_HOST"

  model: "qwen2.5:3b-instruct"

  hq_model: "qwen2.5:7b-instruct"

  ready_timeout_s: 120

  request_timeout_s: 180

  temperature: 0.72

  max_retries: 3


# ---------------------------------------------------------------------------
# IMAGE GENERATION
# ---------------------------------------------------------------------------

image:
  # Existing SD1.5 model retained for CPU compatibility.
  model: "Lykon/dreamshaper-8"

  # Existing higher-quality model retained for CUDA environments.
  hq_model: "black-forest-labs/FLUX.1-schnell"

  steps: 26

  guidance_scale: 6.5

  hq_steps: 4

  hq_guidance_scale: 0.0

  width: 512

  height: 640

  scheduler: "dpmpp_karras"

  vae: "stabilityai/sd-vae-ft-mse"

  hires_fix: false

  hires_scale: 1.5

  hires_denoise: 0.4

  hires_steps: 16

  # IMPORTANT:
  #
  # This is intentionally NOT a photography prompt.
  #
  # The image should visualize the educational content generated by
  # brief.py.
  positive_template: >
    {framing}, {visual_type}, {visual_title}, {subject}, {definition},
    {explanation}, {visual_elements}, {diagram_flow}, {image_text},
    {setting}, {composition}, {color_palette}, {mood}, {style_modifiers},
    clean educational AI infographic, technical illustration,
    information-first composition, clear visual hierarchy, concise readable
    typography, readable labels, clear arrows showing relationships and
    information flow, professional technology publication aesthetic,
    crisp technical detail, sharp graphic elements, useful educational
    content

  negative_template: >
    photorealistic person, portrait, attractive person, generic developer,
    generic programmer, office worker, businessman, businesswoman,
    person using laptop, person using computer, person at desk, lifestyle
    photography, generic workstation, candid photograph, couple, romance,
    romantic, kissing, hugging, wedding, dating, honeymoon, fashion
    photography, DSLR photograph, realistic skin, cinematic portrait,
    generic AI robot, meaningless decoration, gibberish text, misspelled
    text, unreadable text, excessive text, tiny text, watermark, signature,
    logo, lowres, blurry, distorted, cluttered layout, bad typography,
    deformed, disfigured, mutated, extra limbs, extra fingers, nsfw


# ---------------------------------------------------------------------------
# IMAGE POST-PROCESSING
# ---------------------------------------------------------------------------

postproc:
  aspect: "4:5"

  jpeg_quality: 92

  unsharp_radius: 1.2

  unsharp_percent: 80

  unsharp_threshold: 3

  max_bytes: 8388608


# ---------------------------------------------------------------------------
# CAPTION
# ---------------------------------------------------------------------------

caption:
  tone: >
    clear, useful, approachable and educational; explain AI concepts simply,
    accurately and practically without hype

  emoji_budget: 2

  max_length: 2200

  hashtag_placement: "caption"


# ---------------------------------------------------------------------------
# HASHTAGS
# ---------------------------------------------------------------------------

hashtags:
  min_count: 12

  max_count: 18

  tier_broad: 0.30

  tier_mid: 0.50

  tier_niche: 0.20

  brand_tags:
    - "autogram"
    - "aitools"


# ---------------------------------------------------------------------------
# SAFETY / QUALITY GATES
# ---------------------------------------------------------------------------

gates:
  nsfw: true

  degenerate: true

  profanity: true

  degenerate_min_variance: 60.0

  degenerate_dark_mean: 12.0

  degenerate_bright_mean: 243.0


# ---------------------------------------------------------------------------
# REELS
# ---------------------------------------------------------------------------

reel:
  enabled: true

  # Four educational scenes.
  num_scenes: 4

  seconds_per_image: 3.2

  crossfade_s: 0.35

  fps: 30

  width: 1080

  height: 1920

  zoom: 1.12

  audio_dir: "assets/audio"

  ai_video:
    enabled: true

    mode: "auto"

    provider: "huggingface"

    # Animate scene 1 and scene 3.
    ai_scene_indexes:
      - 0
      - 2

    duration_s: 3

    timeout_s: 180

    poll_interval_s: 5

    fallback_to_ffmpeg: true

    keep_intermediate: false


# ---------------------------------------------------------------------------
# YOUTUBE
# ---------------------------------------------------------------------------

youtube:
  privacy_status: "private"

  category_id: "22"


# ---------------------------------------------------------------------------
# STATE
# ---------------------------------------------------------------------------

state:
  history_path: "state/history.json"

  session_path: "state/ig_session.json"

  out_dir: "out"
